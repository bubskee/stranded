syntax = "proto3";

package raft;

option go_package = "github.com/bubskee/stranded/proto/raftpb";

service Raft {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);

  // Client-facing. No separate REST layer — the CLI client dials this directly.
  rpc ClientRequest(ClientRequestArgs) returns (ClientRequestReply);
}

message LogEntry {
    uint64 term = 1;
    uint64 index = 2;
    bytes command = 3;
}

message RequestVoteArgs {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;

  // §5.3 optimization: lets a rejected leader skip straight to the
  // follower's conflicting term rather than backtracking one index at a
  // time. Fields are here now since it's free in the proto; the actual
  // fast-backtrack logic can come after the naive version works.
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}

message ClientRequestArgs {
  bytes command = 1;
}

message ClientRequestReply {
  bool success = 1;
  string leader_hint = 2; // set when success=false and we know who the leader is
  bytes result = 3;
}
